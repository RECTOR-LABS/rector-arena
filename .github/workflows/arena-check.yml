# arena-check — CI adoption of the rector-arena battery.
#
# What it runs on every push to main and every PR:
#   1. `pnpm -r build`   — TS harness + web (tsc only; no contract compile).
#      The battery loads the COMMITTED wasm artifacts (vendor/ft.wasm,
#      contracts/reference-wallet/wasm) — CI never rebuilds them. The rustc
#      1.85 law applies to whoever rebuilds those artifacts and lives in
#      packages/harness/vendor/PROVENANCE.md.
#   2. `ARENA_ATTACK=A1 pnpm arena:run` — the A1 cap-race smoke on both targets
#      (~3 min with full sandbox boots included).
#   3. `pnpm arena:prove` — recomputes committed receipts and verifies the
#      attest-ledger.testnet view (network only, no secrets).
#
# Expected duration: ~5 min (the full ~7 min battery stays LOCAL by design —
# `ARENA_TARGET` unset is never run here; CI gates on the smoke, not the full
# battery).
name: arena-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arena-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pinned to packageManager in package.json
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm -r build

      # A1 smoke: full sandbox boot + cap-race on both targets. Transient
      # sandbox PrepareError on boot is a known retryable (ROADMAP §M0) — a
      # failed step rerun on a fresh job is the documented workaround.
      - name: Arena A1 smoke
        run: ARENA_ATTACK=A1 pnpm arena:run
        timeout-minutes: 20

      - name: Arena prove (committed receipts + live attestation view)
        run: pnpm arena:prove
        timeout-minutes: 5
