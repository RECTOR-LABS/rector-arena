# arena-check — CI adoption of the rector-arena battery.
#
# What it runs on every push to main and every PR:
#   1. `pnpm -r build` — TS harness + web, plus the two wasm contracts
#      (`env -u RUSTFLAGS cargo +1.85 build --release --target wasm32-unknown-unknown`
#      per contract; rustup resolves +1.85 to the installed 1.85.1, pre-pinned
#      below so the parallel contract builds never race the toolchain download).
#      Compatibility law for the wasm: rustc >= 1.86 fails near-sandbox 0.1.5
#      prepare — packages/harness/vendor/PROVENANCE.md.
#   2. `ARENA_ATTACK=A1 pnpm arena:run` — the A1 cap-race smoke on both targets
#      (~3 min with full sandbox boots included).
#   3. `pnpm arena:prove` — recomputes committed receipts and verifies the
#      attest-ledger.testnet view (network only, no secrets).
#
# Expected duration: ~6–10 min (the full ~7 min battery stays LOCAL by design —
# `ARENA_TARGET` unset is never run here; CI gates on the smoke, not the full
# battery).
name: arena-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arena-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pinned to packageManager in package.json
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pre-pin the toolchain the contracts' `cargo +1.85` resolves to.
      # rustup treats bare "1.85" as an invalid custom-link name, so the step
      # installs the official 1.85.1 (what +1.85 resolves to) and makes it the
      # default — the parallel contract builds then compile without racing the
      # toolchain download. Wasm target needed for the contract artifacts.
      - name: Install rust 1.85.1 (wasm32)
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.85.1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/*/target
          key: cargo-1.85.1-${{ runner.os }}-${{ hashFiles('contracts/*/Cargo.lock') }}
          restore-keys: cargo-1.85.1-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm -r build

      # A1 smoke: full sandbox boot + cap-race on both targets. Transient
      # sandbox PrepareError on boot is a known retryable (ROADMAP §M0) — a
      # failed step rerun on a fresh job is the documented workaround.
      - name: Arena A1 smoke
        run: ARENA_ATTACK=A1 pnpm arena:run
        timeout-minutes: 20

      - name: Arena prove (committed receipts + live attestation view)
        run: pnpm arena:prove
        timeout-minutes: 5
