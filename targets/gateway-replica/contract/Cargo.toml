[package]
name = "gateway-replica-forwarder"
version = "0.1.0"
edition = "2021"

[dependencies]
near-sdk = "=4.1.1"
borsh = "=0.9.3"

# crates.io yanked parity-secp256k1 0.7.0, which near-crypto 0.14 (via near-sdk 4.1.1) requires;
# pin the identical version from its source tag so fresh lockfile resolution succeeds.
[patch.crates-io]
parity-secp256k1 = { git = "https://github.com/paritytech/rust-secp256k1", tag = "parity-secp256k1-v0.7.0" }

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
